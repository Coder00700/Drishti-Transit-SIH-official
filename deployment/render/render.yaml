services:
  - type: web
    name: drishti-cloud-api
    runtime: python
    plan: free
    buildCommand: pip install -r deployment/render/requirements.txt
    startCommand: python -m uvicorn deployment.render.cloud_api:app --host 0.0.0.0 --port $PORT --no-access-log --no-proxy-headers
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: Users
      - key: MONGODB_LOGIN_COLLECTION
        value: login
      - key: PUBLICATION_REPLICA_ENABLED
        value: "true"
      - key: PUBLIC_DATABASE
        value: DrishtiPublic
      - key: PORTAL_ORIGIN
        sync: false
      - key: EDGE_SHARED_SECRET
        sync: false
      - key: ALLOW_REGISTRATION
        value: "false"
